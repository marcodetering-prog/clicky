name: Release (Sparkle)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-release:
    runs-on: macos-latest
    env:
      SPARKLE_VERSION: "2.9.1"
      SCHEME: "leanring-buddy"
      CONFIGURATION: "Release"
      APP_NAME: "Clicky"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          REF_NAME="${GITHUB_REF_NAME}"
          if [[ "${REF_NAME}" == v* ]]; then
            VERSION="${REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "build_number=${GITHUB_RUN_NUMBER}" >> "${GITHUB_OUTPUT}"

      - name: Install Sparkle tools
        run: |
          set -euo pipefail
          scripts/sparkle/download_sparkle_tools.sh >/dev/null

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_P12_PASSWORD }}
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="${RUNNER_TEMP}/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "${KEYCHAIN_PASSWORD}" > "${RUNNER_TEMP}/keychain_password.txt"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"

          echo "${MACOS_CERTIFICATE_P12_BASE64}" | base64 --decode > "${RUNNER_TEMP}/certificate.p12"
          security import "${RUNNER_TEMP}/certificate.p12" -k "${KEYCHAIN_PATH}" -P "${MACOS_CERTIFICATE_P12_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "${KEYCHAIN_PATH}"

          # Allow codesign to access the key without an interactive prompt
          security set-key-partition-list -S apple-tool:,apple: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"

      - name: Build archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          BUILD_NUMBER="${{ steps.version.outputs.build_number }}"

          xcodebuild -resolvePackageDependencies -scheme "${SCHEME}"

          xcodebuild \
            -scheme "${SCHEME}" \
            -configuration "${CONFIGURATION}" \
            -archivePath "${RUNNER_TEMP}/${APP_NAME}.xcarchive" \
            MARKETING_VERSION="${VERSION}" \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            archive

      - name: Export app
        run: |
          set -euo pipefail

          EXPORT_DIR="${RUNNER_TEMP}/export"
          mkdir -p "${EXPORT_DIR}"

          cat > "${RUNNER_TEMP}/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>developer-id</string>
          </dict>
          </plist>
          PLIST

          xcodebuild \
            -exportArchive \
            -archivePath "${RUNNER_TEMP}/${APP_NAME}.xcarchive" \
            -exportPath "${EXPORT_DIR}" \
            -exportOptionsPlist "${RUNNER_TEMP}/ExportOptions.plist"

          ls -la "${EXPORT_DIR}"

      - name: Prepare Sparkle signing key
        env:
          SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SPARKLE_ED25519_PRIVATE_KEY}" ]]; then
            echo "Missing SPARKLE_ED25519_PRIVATE_KEY secret"
            exit 1
          fi
          echo "${SPARKLE_ED25519_PRIVATE_KEY}" > "${RUNNER_TEMP}/sparkle_ed25519_private_key.txt"

      - name: Notarize + staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"

          EXPORT_DIR="${RUNNER_TEMP}/export"
          APP_PATH="${EXPORT_DIR}/${APP_NAME}.app"
          if [[ ! -d "${APP_PATH}" ]]; then
            echo "Expected app at ${APP_PATH} but it does not exist"
            exit 1
          fi

          SUBMISSION_ZIP="${RUNNER_TEMP}/${APP_NAME}-submission.zip"
          ditto -c -k --sequesterRsrc --keepParent "${APP_PATH}" "${SUBMISSION_ZIP}"

          xcrun notarytool submit "${SUBMISSION_ZIP}" \
            --apple-id "${APPLE_ID}" \
            --password "${APPLE_APP_SPECIFIC_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" \
            --wait

          xcrun stapler staple "${APP_PATH}"

      - name: Create update zip + appcast
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          BUILD_NUMBER="${{ steps.version.outputs.build_number }}"

          EXPORT_DIR="${RUNNER_TEMP}/export"
          APP_PATH="${EXPORT_DIR}/${APP_NAME}.app"

          DIST_DIR="${RUNNER_TEMP}/dist"
          mkdir -p "${DIST_DIR}"

          UPDATE_ZIP="${DIST_DIR}/${APP_NAME}-${VERSION}.zip"
          ditto -c -k --sequesterRsrc --keepParent "${APP_PATH}" "${UPDATE_ZIP}"

          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${APP_NAME}-${VERSION}.zip"

          ED_KEY_FILE="${RUNNER_TEMP}/sparkle_ed25519_private_key.txt" \
            scripts/sparkle/make_appcast.sh "${VERSION}" "${BUILD_NUMBER}" "${UPDATE_ZIP}" "${DOWNLOAD_URL}" >/dev/null

          cp appcast.xml "${DIST_DIR}/appcast.xml"

          echo "dist contents:"
          ls -la "${DIST_DIR}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/dist/*.zip
            ${{ runner.temp }}/dist/appcast.xml

